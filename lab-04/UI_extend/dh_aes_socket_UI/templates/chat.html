<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER CHAT - Client {{ client_id }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020202;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ea;
            --neon-yellow: #fcee0a;
            --msg-bg-self: rgba(0, 243, 255, 0.15);
            --msg-bg-other: rgba(255, 0, 234, 0.15);
            --text-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.08) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.08) 2px, transparent 2px);
            background-size: 50px 50px;
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }

        /* Glowing background orbs */
        .bg-orb-1, .bg-orb-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.4;
        }

        .bg-orb-1 {
            top: 10%;
            left: 15%;
            width: 400px;
            height: 400px;
            background: var(--neon-pink);
            animation: float-1 8s ease-in-out infinite alternate;
        }

        .bg-orb-2 {
            bottom: 10%;
            right: 15%;
            width: 500px;
            height: 500px;
            background: var(--neon-cyan);
            animation: float-2 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes float-1 {
            0% { transform: translateY(0) scale(1); opacity: 0.3; }
            100% { transform: translateY(-40px) scale(1.1); opacity: 0.5; }
        }

        @keyframes float-2 {
            0% { transform: translateY(0) scale(1); opacity: 0.2; }
            100% { transform: translateY(-50px) scale(1.2); opacity: 0.4; }
        }

        /* CRT Scanline effect */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            z-index: 2;
            background-size: 100% 4px;
            pointer-events: none;
        }

        .chat-container {
            width: 100%;
            max-width: 650px;
            height: 85vh;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 25px var(--neon-cyan), inset 0 0 25px rgba(0, 243, 255, 0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        /* Glitch effect on borders */
        .chat-container::before, .chat-container::after {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            background: transparent;
            z-index: -1;
            pointer-events: none;
        }
        
        .chat-container::before {
            border: 3px solid var(--neon-pink);
            clip-path: polygon(0% 10%, 10% 0%, 100% 0%, 100% 90%, 90% 100%, 0% 100%);
            animation: glitch-border-1 3s infinite linear alternate-reverse;
            box-shadow: 0 0 30px var(--neon-pink);
        }

        .chat-container::after {
            border: 3px solid var(--neon-cyan);
            clip-path: polygon(10% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 10%);
            animation: glitch-border-2 2s infinite linear alternate-reverse;
            opacity: 0.7;
        }

        @keyframes glitch-border-1 {
            0% { clip-path: polygon(0 2%, 100% 2%, 100% 5%, 0 5%); transform: translate(3px, -3px); }
            20% { clip-path: polygon(0 15%, 100% 15%, 100% 15%, 0 15%); transform: translate(-3px, 3px); }
            40% { clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%); transform: translate(3px, 3px); }
            60% { clip-path: polygon(0 1%, 100% 1%, 100% 2%, 0 2%); transform: translate(-3px, -3px); }
            80% { clip-path: polygon(0 33%, 100% 33%, 100% 33%, 0 33%); transform: translate(2px, 2px); }
            100% { clip-path: polygon(0 44%, 100% 44%, 100% 44%, 0 44%); transform: translate(-2px, -2px); }
        }

        @keyframes glitch-border-2 {
            0% { clip-path: polygon(0 60%, 100% 60%, 100% 65%, 0 65%); transform: translate(-3px, 3px); }
            20% { clip-path: polygon(0 75%, 100% 75%, 100% 80%, 0 80%); transform: translate(3px, -3px); }
            40% { clip-path: polygon(0 50%, 100% 50%, 100% 55%, 0 55%); transform: translate(-2px, 2px); }
            60% { clip-path: polygon(0 85%, 100% 85%, 100% 90%, 0 90%); transform: translate(2px, -2px); }
            80% { clip-path: polygon(0 20%, 100% 20%, 100% 25%, 0 25%); transform: translate(-3px, -3px); }
            100% { clip-path: polygon(0 95%, 100% 95%, 100% 100%, 0 100%); transform: translate(3px, 3px); }
        }

        .chat-header {
            padding: 20px 25px;
            border-bottom: 2px solid var(--neon-cyan);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 243, 255, 0.1);
            position: relative;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-color);
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            display: flex;
            align-items: center;
            gap: 15px;
            letter-spacing: 2px;
        }

        .algo-name {
            font-size: 0.9rem;
            color: var(--neon-yellow);
            text-shadow: 0 0 8px var(--neon-yellow);
            margin-top: 6px;
            display: block;
            letter-spacing: 4px;
        }

        .status-dot {
            width: 14px;
            height: 14px;
            background-color: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-cyan);
            border-radius: 50%;
            animation: flicker 0.5s infinite alternate;
        }

        .status-dot.disconnected {
            background-color: #ff003c;
            box-shadow: 0 0 15px #ff003c, 0 0 30px #ff003c;
            animation: none;
        }

        @keyframes flicker {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan); }
        }

        .chat-messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .message {
            max-width: 85%;
            padding: 12px 18px;
            font-size: 1.1rem;
            position: relative;
            word-wrap: break-word;
            line-height: 1.4;
            text-shadow: 0 0 3px rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .message.received {
            background: var(--msg-bg-other);
            align-self: flex-start;
            border-left: 4px solid var(--neon-pink);
            color: var(--text-color);
            box-shadow: 0 0 15px rgba(255, 0, 234, 0.3);
            border-radius: 0 10px 10px 10px;
        }

        .message.sent {
            background: var(--msg-bg-self);
            align-self: flex-end;
            border-right: 4px solid var(--neon-cyan);
            color: var(--text-color);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            border-radius: 10px 0 10px 10px;
        }

        .chat-input-container {
            padding: 20px;
            border-top: 2px solid var(--neon-cyan);
            background: rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .chat-input-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
            animation: scanline 2s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(80px); opacity: 0; }
        }

        .chat-form {
            display: flex;
            gap: 15px;
        }

        .chat-input {
            flex: 1;
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid var(--neon-cyan);
            padding: 15px;
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s;
        }

        .chat-input:focus {
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.6) inset, 0 0 10px var(--neon-cyan);
            background: rgba(0, 243, 255, 0.1);
        }

        .chat-input::placeholder {
            color: rgba(0, 243, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .send-btn {
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            padding: 0 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            letter-spacing: 2px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .send-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 25px var(--neon-cyan);
            text-shadow: none;
        }

        /* Glitch text effect */
        .glitch-text {
            position: relative;
            display: inline-block;
        }

        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .glitch-text::before {
            left: 3px;
            text-shadow: -3px 0 red;
            animation: glitch-anim-text 0.4s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -3px;
            text-shadow: 3px 0 blue;
            animation: glitch-anim-text 0.3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-text {
            0% { clip: rect(10px, 9999px, 85px, 0); transform: translate(1px, -1px); }
            20% { clip: rect(50px, 9999px, 30px, 0); transform: translate(-1px, 1px); }
            40% { clip: rect(10px, 9999px, 90px, 0); transform: translate(1px, 1px); }
            60% { clip: rect(70px, 9999px, 15px, 0); transform: translate(-1px, -1px); }
            80% { clip: rect(35px, 9999px, 60px, 0); transform: translate(1px, 0px); }
            100% { clip: rect(95px, 9999px, 45px, 0); transform: translate(-1px, 0px); }
        }

        .credit {
            position: absolute;
            bottom: 25px;
            right: 40px;
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-pink);
            font-size: 1.1rem;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
            z-index: 20;
            pointer-events: none;
            letter-spacing: 2px;
            animation: pulse-pink 1.5s infinite alternate;
        }

        @keyframes pulse-pink {
            0% { opacity: 0.7; text-shadow: 0 0 8px var(--neon-pink); transform: scale(1); }
            100% { opacity: 1; text-shadow: 0 0 20px var(--neon-pink), 0 0 30px var(--neon-pink); transform: scale(1.05); }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020202; border-left: 1px solid rgba(0, 243, 255, 0.2); }
        ::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #fff; }
    </style>
</head>
<body>
    <div class="bg-orb-1"></div>
    <div class="bg-orb-2"></div>

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-title">
                <div id="status-indicator" class="status-dot"></div>
                <div>
                    TERMINAL // CLIENT_{{ client_id }}
                    <span class="algo-name glitch-text" data-text="Diffie-Hellman - AES Socket">Diffie-Hellman - AES Socket</span>
                </div>
            </div>
        </div>

        <div class="chat-messages" id="messages"></div>

        <div class="chat-input-container">
            <form class="chat-form" id="chat-form">
                <input type="text" id="message-input" class="chat-input" placeholder="> Nhập tin nhắn..." autocomplete="off">
                <button type="submit" id="send-button" class="send-btn">Gửi</button>
            </form>
        </div>
    </div>

    <div class="credit">Cre: Võ Công Bằng 2380600191</div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const statusIndicator = document.getElementById('status-indicator');

        let lastMessageId = 0;
        let isConnected = true;

        function appendMessage(text, type) {
            const msgEl = document.createElement('div');
            msgEl.classList.add('message', type);
            
            // Cyberpunk text typing effect
            messagesDiv.appendChild(msgEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            let i = 0;
            msgEl.textContent = '';
            const typeWriter = setInterval(() => {
                msgEl.textContent += text.charAt(i);
                i++;
                if (i >= text.length) {
                    clearInterval(typeWriter);
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
            }, 10);
        }

        async function fetchMessages() {
            if (!isConnected) return;
            try {
                const res = await fetch(`/api/messages?since=${lastMessageId}`);
                if (!res.ok) throw new Error("Network response was not ok");
                
                const data = await res.json();
                
                if (data.connected === false && isConnected) {
                    handleDisconnect();
                }

                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(msg => {
                        appendMessage(msg.text, 'received');
                        lastMessageId = Math.max(lastMessageId, msg.id);
                    });
                }
            } catch (error) {
                console.error("Error fetching messages:", error);
            } finally {
                if (isConnected) {
                    setTimeout(fetchMessages, 1000); 
                }
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !isConnected) return;

            messageInput.value = '';
            messageInput.focus();

            appendMessage(text, 'sent');

            try {
                const res = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                
                const data = await res.json();
                if (!data.ok) {
                    if (data.error === "disconnected") {
                        handleDisconnect();
                    } else {
                        appendMessage(`ERROR: ${data.error}`, 'received');
                    }
                }
                
                if (text.toLowerCase() === 'exit') {
                    handleDisconnect();
                }
            } catch (error) {
                appendMessage("SYS_ERROR: TX_FAILED", 'received');
            }
        });

        function handleDisconnect() {
            isConnected = false;
            statusIndicator.classList.add('disconnected');
            messageInput.disabled = true;
            sendButton.disabled = true;
            messageInput.placeholder = "> SYSTEM DISCONNECTED.";
            appendMessage("CONNECTION TERMINATED.", 'received');
        }

        fetchMessages();
    </script>
</body>
</html>
